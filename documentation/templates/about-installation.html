<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>NST About / Installation</title>
<style>
@font-face {
  font-family: "JetBrains Mono";
  font-style: normal;
  font-weight: 400;
  src: url("__JETBRAINS_MONO_REGULAR_URI__") format("woff2");
}

/* Use the same @page margins as the approved page-2 pass so the
   footer page number stays aligned with the locked cover positioning. */
@page {
  size: Letter;
  margin: __INTERIOR_PAGE_MARGIN__;
}

body {
  margin: 0;
  padding: 0 __INTERIOR_TEXT_SIDE_PADDING__;
  background: #fff;
  color: __INTERIOR_TEXT_COLOR__;
  font-family: __INTERIOR_FONT_FAMILY__;
  font-size: __INTERIOR_BASE_FONT_SIZE__;
  line-height: __INTERIOR_BASE_LINE_HEIGHT__;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

h1 {
  margin: __INTERIOR_H1_MARGIN__;
  color: __INTERIOR_TEXT_COLOR__;
  font-family: __INTERIOR_FONT_FAMILY__;
  font-size: __INTERIOR_H1_SIZE__;
  font-weight: 400;
}

h1:nth-of-type(2) {
  margin-top: 1.4em;
}

p {
  margin: __INTERIOR_PARAGRAPH_MARGIN__;
}

ol {
  margin: 0.4em 0 0 1.2em;
  padding: 0;
}

ol > li {
  margin-bottom: 0.6em;
}

ol > li > p {
  margin: 0.15em 0;
}

a {
  color: __INTERIOR_LINK_COLOR__;
  text-decoration: __INTERIOR_LINK_DECORATION__;
}

code {
  background: #efefef;
  border-radius: 2px;
  font-family: "JetBrains Mono", "Consolas", "Monaco", monospace;
  font-size: 0.9em;
  padding: 0.1em 0.35em;
}

pre {
  background: #eeeeee;
  border-radius: 2px;
  margin: 0.5em 0;
  padding: 0.5em 0.8em;
}

pre code {
  background: none;
  padding: 0;
}

.py-module,
.py-punct {
  color: #24292f;
}

.py-func {
  color: #8250df;
}

.py-string {
  color: #c82829;
}

.toolbar-icon {
  display: inline-block;
  height: 32px;
  margin-left: 4px;
  vertical-align: middle;
  width: 32px;
}

.page-number {
  position: fixed;
  right: __INTERIOR_PAGE_NUMBER_RIGHT__;
  bottom: __INTERIOR_PAGE_NUMBER_BOTTOM__;
  transform: __INTERIOR_PAGE_NUMBER_TRANSFORM__;
  color: __INTERIOR_PAGE_NUMBER_COLOR__;
  font-family: __INTERIOR_PAGE_NUMBER_FONT_FAMILY__;
  font-size: __INTERIOR_PAGE_NUMBER_FONT_SIZE__;
}
</style>
</head>
<body>
<div class="page-number">2</div>
</body>
</html>
