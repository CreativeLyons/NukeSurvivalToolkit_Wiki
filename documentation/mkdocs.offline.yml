INHERIT: mkdocs.yml

# Offline/local-file build config used for release ZIP assets.
# Nav is defined only in mkdocs.yml. This file adds file:// compatibility (offline + privacy
# plugins), disables navigation.instant, omits webfonts, and drops online-only JS.
# Build with: mkdocs build -f mkdocs.offline.yml

plugins:
  search: {}
  offline: {}
  privacy: {}

theme:
  features:
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  font: false

extra_javascript:
  - js/video-swap.js
  - js/external-links.js
